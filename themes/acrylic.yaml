  codemirror-meta: 'rgb(19, 25, 34)'
  codemirror-property: 'rgb(85, 64, 176)'
  codemirror-atom: 'rgb(39, 72, 147)'
  codemirror-string: 'rgb(0, 77, 153)'
  codemirror-keyword: 'rgb(70, 112, 216)'
  codemirror-number: 'rgb(204, 85, 0)'
  mcg-title-font-weight: '400'
  mush-title-font-weight: '500'
  mush-title-font-size: 'var(--ha-font-size-2xl)'
  light-grey-color: 'rgb(60, 67, 77)'
  mush-rgb-grey: '60, 67, 77'

  # Misc sizes
  paper-slider-height: '5px'
  border-radius: '8px'

  # A non-empty single-mode map is required by Home Assistant 2026.8+.
  # Variables stay at the top level so card-mod and UIX can use this theme as an engine.
  modes:
    light:
      app-theme-color: 'rgb(247, 248, 251)'
